<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Planner</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("lab.theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage off: follow the system */ }
  })();
</script>
<style>
  .city-main { flex: 1; min-height: 0; overflow: auto; }
  .city-body { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .city-board { flex: 0 1 520px; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; box-shadow: var(--shadow); }
  .city-board svg { width: 100%; height: auto; display: block; }
  .city-side { flex: 1 1 300px; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); }
  .city-side h3 { margin: 0 0 8px; font-size: 14px; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .slider-row input[type=range] { flex: 1; }
  .kv2 { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 8px 0; font-size: 13px; }
  .kv2 > :nth-child(odd) { color: var(--muted); }
  .on-t { color: var(--ok); font-weight: 600; }
  .off-t { color: var(--err); font-weight: 600; }
  .top3 { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  .top3 td { border-bottom: 1px solid var(--border); padding: 4px 6px; }
  .top3 td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .top3 tr.pick td { font-weight: 600; }
  pre.prompt { white-space: pre-wrap; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; max-height: 340px; overflow: auto; margin: 6px 0 0; }
  .g-line { stroke: var(--border); stroke-width: 1; }
  .g-axis { fill: var(--muted); font-size: 10px; }
  .g-cc { fill: var(--panel-2); stroke: var(--c-manager); stroke-width: 1.5; }
  .g-cc-t { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .g-target { fill: var(--accent-soft); opacity: .55; }
  .g-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .g-house.on { fill: var(--ok); }
  .g-house.off { fill: var(--err); }
  .g-house.last { stroke: var(--hl); stroke-width: 3; }
  .g-num { fill: #fff; font-size: 13px; font-weight: 700; }
  .r-terr { fill: var(--accent-soft); opacity: .5; }
  .r-wood { fill: #2f855a; }
  .r-stone { fill: var(--muted); }
  .r-metal { fill: var(--warn); }
  .r-struct { fill: var(--panel-2); stroke: var(--c-manager); stroke-width: .8; }
  .r-field { fill: #e9d8a6; stroke: #b7950b; stroke-width: .6; opacity: .8; }
  .r-cc { fill: var(--panel-2); stroke: var(--c-manager); stroke-width: 1.6; }
  .r-slot { fill: none; stroke: var(--accent); stroke-width: .6; stroke-dasharray: 2 2; opacity: .7; }
  .r-slot.pick { stroke: var(--hl); stroke-width: 1.4; stroke-dasharray: none; opacity: 1; }
  .r-house { fill: var(--c-action); stroke: #fff; stroke-width: .5; }
  .r-house.last { stroke: var(--hl); stroke-width: 1.6; }
  .r-num { fill: #fff; font-size: 7px; font-weight: 700; }
  .r-lbl { fill: var(--muted); font-size: 7px; }
  .dry { color: var(--warn); font-weight: 600; }
  .r-drop { fill: none; stroke: var(--err); stroke-width: 1; stroke-dasharray: 3 2; }
  @media (max-width: 600px) { .city-body { padding: 16px 16px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Strategos Lab</div>
  <span class="muted">City planner</span>
  <div class="topright"><a class="btn ghost" href="/">Lab</a></div>
</header>
<div class="toolbar">
  <label>Run <select id="run"></select></label>
  <span id="summary" class="small"></span>
  <span class="spacer"></span>
  <span id="status" class="muted small"></span>
</div>
<main class="city-main">
  <div class="city-body">
    <div class="city-board">
      <svg id="board" viewBox="0 0 430 430" role="img" aria-label="City grid"></svg>
      <div class="slider-row">
        <span class="muted small">step</span>
        <input type="range" id="step" min="0" max="0" value="0">
        <span id="step-n" class="mono">0/0</span>
      </div>
    </div>
    <aside class="city-side" id="side"><p class="muted">No run loaded.</p></aside>
  </div>
</main>
<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg", C = 40, M = 30;  // cell px, margin for axis labels
  var runSel = document.getElementById("run"), slider = document.getElementById("step");
  var board = document.getElementById("board"), side = document.getElementById("side");
  var run = null;

  function el(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function pct(p) { return p == null ? "–" : (p * 100).toFixed(1) + "%"; }
  function key(c) { return c[0] + "," + c[1]; }
  function cellOf(id) { var m = /^c(\d+)_(\d+)$/.exec(id || ""); return m ? "(" + m[1] + ", " + m[2] + ")" : id; }

  function getJSON(url) {
    return fetch(url, {cache: "no-store"}).then(function (r) {
      if (!r.ok) throw new Error(url + ": HTTP " + r.status);
      return r.json();
    });
  }

  function loadIndex() {
    return getJSON("/static/city/runs/index.json").then(function (idx) {
      runSel.innerHTML = "";
      idx.forEach(function (e) {
        var o = document.createElement("option");
        o.value = e.id;
        o.textContent = e.mode === "real"
          ? (e.variant === "timeline1" ? "timeline · " : "real map · ") + e.goal + " · " + e.houses + " houses · touching " + e.touching_another +
            (e.dropped != null ? " · dropped " + e.dropped : "") +
            (e.dry ? " · DRY (no Jev)" : "") + "  ·  " + e.id.slice(0, 15) + (e.error ? "  ·  error" : "")
          : (e.variant || "?") + " · " + (e.goal || "square6") + " · tier " + (e.tier || "A") +
            " · " + e.on_target + "/" + (e.total || e.steps || 0) + "  ·  " + e.id.slice(0, 15) + (e.error ? "  ·  error" : "");
        runSel.appendChild(o);
      });
      var want = new URLSearchParams(location.search).get("run");
      if (want && idx.some(function (e) { return e.id === want; })) { runSel.value = want; loadRun(want); }
      else if (idx.length) loadRun(idx[0].id);
      else document.getElementById("status").textContent = "no runs yet: python3 city_demo.py";
    }).catch(function (e) { document.getElementById("status").textContent = String(e); });
  }

  function loadRun(id) {
    getJSON("/static/city/runs/" + encodeURIComponent(id) + ".json").then(function (r) {
      run = r;
      if (r.mode === "real") { loadReal(r); return; }
      var placed = r.steps.filter(function (s) { return s.cell; }).length;
      slider.max = placed;
      slider.value = placed;
      var s = r.summary || {};
      document.getElementById("summary").innerHTML =
        "on target <b>" + s.on_target + "/" + r.target.length + "</b> · off " + s.off_target +
        " · " + s.steps + " steps · " + esc(r.variant) + " / " + esc(r.goal || "square6") +
        " · tier " + esc(r.tier || "A") +
        (s.p_on_min != null ? " · P(on) min " + s.p_on_min.toFixed(2) : "") +
        (s.avg_ms ? " · avg " + s.avg_ms + " ms" : "") +
        (s.error ? ' · <span class="off-t">' + esc(s.error) + "</span>" : "");
      document.getElementById("status").textContent = "started " + r.started;
      render();
    }).catch(function (e) { document.getElementById("status").textContent = String(e); });
  }

  function drawGrid(r) {
    board.innerHTML = "";
    var W = r.grid.w, H = r.grid.h;
    board.setAttribute("viewBox", "0 0 " + (M + W * C + 2) + " " + (M + H * C + 2));
    var targ = {};
    r.target.forEach(function (c) { targ[key(c)] = 1; });
    r.target.forEach(function (c) {
      board.appendChild(el("rect", {"class": "g-target", x: M + c[0] * C, y: M + c[1] * C, width: C, height: C}));
    });
    for (var i = 0; i <= W; i++) board.appendChild(el("line", {"class": "g-line", x1: M + i * C, y1: M, x2: M + i * C, y2: M + H * C}));
    for (var j = 0; j <= H; j++) board.appendChild(el("line", {"class": "g-line", x1: M, y1: M + j * C, x2: M + W * C, y2: M + j * C}));
    for (i = 0; i < W; i++) board.appendChild(el("text", {"class": "g-axis", x: M + i * C + C / 2, y: M - 10, "text-anchor": "middle"}, i));
    for (j = 0; j < H; j++) board.appendChild(el("text", {"class": "g-axis", x: M - 10, y: M + j * C + C / 2 + 4, "text-anchor": "middle"}, j));
    // target ring as a dashed outline: every target-cell edge not shared with another target cell
    var d = "";
    r.target.forEach(function (c) {
      var x = M + c[0] * C, y = M + c[1] * C;
      if (!targ[key([c[0], c[1] - 1])]) d += "M" + x + " " + y + "h" + C;
      if (!targ[key([c[0], c[1] + 1])]) d += "M" + x + " " + (y + C) + "h" + C;
      if (!targ[key([c[0] - 1, c[1]])]) d += "M" + x + " " + y + "v" + C;
      if (!targ[key([c[0] + 1, c[1]])]) d += "M" + (x + C) + " " + y + "v" + C;
    });
    board.appendChild(el("path", {"class": "g-ring", d: d}));
    var xs = r.cc.map(function (c) { return c[0]; }), ys = r.cc.map(function (c) { return c[1]; });
    var x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys);
    var w = Math.max.apply(null, xs) - x0 + 1, h = Math.max.apply(null, ys) - y0 + 1;
    board.appendChild(el("rect", {"class": "g-cc", x: M + x0 * C + 2, y: M + y0 * C + 2, width: w * C - 4, height: h * C - 4, rx: 4}));
    board.appendChild(el("text", {"class": "g-cc-t", x: M + (x0 + w / 2) * C, y: M + (y0 + h / 2) * C + 5, "text-anchor": "middle"}, "CC"));
  }

  // -- real-map mode: territory, resources, structures as rotated rectangles, slots, houses --------
  function loadReal(r) {
    var placed = r.steps.filter(function (s) { return s.house; }).length;
    slider.max = placed;
    slider.value = placed;
    var s = r.summary || {};
    document.getElementById("summary").innerHTML = (r.timeline ? "real timeline (minutes " + esc((r.source.minutes || []).join(",")) + ")" : "real map") +
      " · <b>" + esc(r.civ) + "</b> · " + s.houses + " houses" + (r.timeline ? " · Petra structures dropped " + (s.dropped || 0) : "") +
      (r.dry ? ' · <span class="dry">DRY run, no Jev (first option taken)</span>' : "") +
      " · touching another " + s.touching_another + " · lines ≥3: " + esc(JSON.stringify(s.lines_3plus || [])) +
      " · gap to CC min/mean " + s.gap_cc_min + "/" + s.gap_cc_mean + " m · next to field " + s.next_to_field +
      " · next to woods " + s.next_to_woods + (s.error ? ' · <span class="off-t">' + esc(s.error) + "</span>" : "");
    document.getElementById("status").textContent = "started " + r.started;
    render();
  }

  function corners(x, z, a, w, d) {   // 0 A.D. rotation: local x -> (cos a, -sin a), local z -> (sin a, cos a)
    var ca = Math.cos(a), sa = Math.sin(a), out = [];
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (c) {
      var lx = c[0] * w / 2, lz = c[1] * d / 2;
      out.push([x + lx * ca + lz * sa, z - lx * sa + lz * ca]);
    });
    return out;
  }

  function drawReal(r, k) {
    board.innerHTML = "";
    var step = k >= 1 ? r.steps[k - 1] : r.steps[0];
    var m = (r.maps && step && r.maps[String(step.minute)]) || r.map, t = m.territory, c = t.cell, PAD = 10;
    var minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
    t.grid.forEach(function (row, j) {
      for (var i = 0; i < row.length; i++) if (row[i] === "1") {
        var x = (i + t.x0) * c, z = (j + t.z0) * c;
        minx = Math.min(minx, x); maxx = Math.max(maxx, x + c); minz = Math.min(minz, z); maxz = Math.max(maxz, z + c);
      }
    });
    minx -= PAD; minz -= PAD; maxx += PAD; maxz += PAD;
    board.setAttribute("viewBox", "0 0 " + (maxx - minx) + " " + (maxz - minz));
    function X(x) { return x - minx; }
    function Y(z) { return maxz - z; }          // north up
    function poly(pts, cls) {
      return el("polygon", {"class": cls, points: pts.map(function (p) { return X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1); }).join(" ")});
    }
    t.grid.forEach(function (row, j) {
      for (var i = 0; i < row.length; i++) if (row[i] === "1")
        board.appendChild(el("rect", {"class": "r-terr", x: X((i + t.x0) * c), y: Y((j + t.z0) * c + c), width: c + .2, height: c + .2}));
    });
    m.resources.forEach(function (q) {
      if (q[1] < minx || q[1] > maxx || q[2] < minz || q[2] > maxz) return;
      board.appendChild(el("circle", {"class": q[0] === "wood" ? "r-wood" : q[0] === "metal" ? "r-metal" : "r-stone",
        cx: X(q[1]), cy: Y(q[2]), r: q[0] === "wood" ? 1.6 : 4}));
    });
    m.structures.forEach(function (st) {
      var cls = /civil_centre/.test(st.tpl) ? "r-cc" : /field/.test(st.tpl) ? "r-field" : "r-struct";
      var g = el("g", {});
      g.appendChild(el("title", {}, st.tpl.split("/").pop()));
      g.appendChild(poly(corners(st.x, st.z, st.a, st.w, st.d), cls));
      board.appendChild(g);
      if (!/field/.test(st.tpl)) board.appendChild(el("text", {"class": "r-lbl", x: X(st.x), y: Y(st.z) + 2.5, "text-anchor": "middle"},
        st.tpl.split("/").pop().replace("civil_centre", "CC").slice(0, 10)));
    });
    var a = m.cc.a, hw = m.house.w, hd = m.house.d;
    (r.dropped || []).forEach(function (d) {       // Petra structures dropped because a Jev house stands there
      if (step && d.minute <= step.minute) {
        var g = el("g", {});
        g.appendChild(el("title", {}, "dropped at minute " + d.minute + ": " + d.tpl.split("/").pop()));
        g.appendChild(poly(corners(d.x, d.z, d.a != null ? d.a : a, d.w || 14, d.d || 14), "r-drop"));
        board.appendChild(g);
      }
    });
    if (step && step.slots) Object.keys(step.slots).forEach(function (id) {
      var p = step.slots[id];
      board.appendChild(poly(corners(p[0], p[1], a, hw - 1, hd - 1), "r-slot" + (k >= 1 && id === step.choice ? " pick" : "")));
    });
    r.steps.slice(0, k).forEach(function (s, i) {
      if (!s.house) return;
      var g = el("g", {});
      g.appendChild(el("title", {}, "house " + s.n + ": " + s.text));
      g.appendChild(poly(corners(s.house[0], s.house[1], a, hw - 1.5, hd - 1.5), "r-house" + (i === k - 1 ? " last" : "")));
      g.appendChild(el("text", {"class": "r-num", x: X(s.house[0]), y: Y(s.house[1]) + 2.5, "text-anchor": "middle"}, s.n));
      board.appendChild(g);
    });
  }

  function panelReal(r, k) {
    if (k === 0) {
      return "<h3>Before question 1</h3>" +
        '<div class="kv2"><span>goal (civ line)</span><span>' + esc(r.goal_text) + "</span>" +
        "<span>candidates</span><span>" + esc(r.rule) + "</span>" +
        "<span>facts used</span><span>" + esc((r.facts_used || []).join(", ") || "core only") + "</span>" +
        "<span>start</span><span>" + (r.timeline ? "real timeline: question k at the minute Petra's k-th house appears (minutes " +
          esc((r.source.minutes || []).join(", ")) + "); Petra's houses left out; a Petra structure that overlaps a Jev house is dropped"
          : "minute " + r.source.minute + " snapshot without its houses") + "</span>" +
        "<span>by side</span><span>" + esc(JSON.stringify((r.summary || {}).by_side || {})) + "</span></div>" +
        '<p class="muted small">Dashed squares: the slots offered in that question. Move the slider to replay.</p>' +
        (r.steps[0] ? "<details><summary class=\"small\">Prompt of question 1</summary><pre class=\"prompt mono\">" +
          esc(r.steps[0].prompt) + "</pre></details>" : "");
    }
    var s = r.steps[k - 1];
    var rows = (s.top || []).slice(0, 3).map(function (t) {
      return "<tr" + (t.id === s.choice ? ' class="pick"' : "") + "><td>" + esc(t.text) + "</td><td class=\"n\">" + pct(t.p) + "</td></tr>";
    }).join("");
    var drops = (r.dropped || []).filter(function (d) { return d.minute <= (s.minute || 0); }).map(function (d) {
      return d.tpl.split("/").pop() + " (minute " + d.minute + ")"; });
    return "<h3>Question " + s.n + " of " + r.steps.length + (s.minute != null ? " · game minute " + s.minute : "") +
      (r.dry ? ' <span class="dry">(dry)</span>' : "") + "</h3>" +
      '<div class="kv2"><span>options</span><span>' + s.n_options + "</span>" +
      (r.timeline ? "<span>Petra dropped</span><span>" + (drops.length ? esc(drops.join(", ")) : "none so far") + "</span>" : "") +
      "<span>Jev's choice</span><span>" + esc(s.text) + " · p " + pct(s.p) + "</span>" +
      "<span>time</span><span>" + (s.ms != null ? s.ms + " ms" : "–") + "</span></div>" +
      '<div class="small muted">Top 3 options</div><table class="top3">' + rows + "</table>" +
      "<details style=\"margin-top:10px\"><summary class=\"small\">Prompt sent</summary><pre class=\"prompt mono\">" +
      esc(s.prompt) + "</pre></details>";
  }

  function render() {
    if (!run) return;
    if (run.mode === "real") {
      var kr = +slider.value;
      document.getElementById("step-n").textContent = kr + "/" + slider.max;
      drawReal(run, kr);
      side.innerHTML = panelReal(run, kr);
      return;
    }
    var k = +slider.value, placed = run.steps.filter(function (s) { return s.cell; });
    document.getElementById("step-n").textContent = k + "/" + placed.length;
    drawGrid(run);
    placed.slice(0, k).forEach(function (s, i) {
      var x = M + s.cell[0] * C, y = M + s.cell[1] * C;
      var g = el("g", {});
      var t = el("title", {}, "house " + s.n + " at (" + s.cell[0] + ", " + s.cell[1] + ") p=" + pct(s.p));
      g.appendChild(t);
      g.appendChild(el("rect", {"class": "g-house " + (s.on_target ? "on" : "off") + (i === k - 1 ? " last" : ""),
        x: x + 4, y: y + 4, width: C - 8, height: C - 8, rx: 4}));
      g.appendChild(el("text", {"class": "g-num", x: x + C / 2, y: y + C / 2 + 5, "text-anchor": "middle"}, s.n));
      board.appendChild(g);
    });
    side.innerHTML = panel(k);
  }

  function panel(k) {
    var errStep = run.steps.filter(function (s) { return s.error; })[0];
    if (k === 0) {
      return "<h3>Before question 1</h3><p class=\"muted small\">Move the slider to replay the build. " +
        run.target.length + " target cells (dashed ring).</p>" +
        (errStep ? '<p class="off-t small">Stopped at q' + errStep.n + ": " + esc(errStep.error) + "</p>" : "") +
        (r.goal_text ? '<div class="kv2"><span>goal</span><span>' + esc(r.goal_text) + "</span>" +
          "<span>candidates</span><span>" + esc(r.rule || "") + "</span>" +
          "<span>variant</span><span>" + esc((r.variant_spec || {}).note || r.variant) + "</span></div>" : "") +
        "<details><summary class=\"small\">Prompt template</summary><pre class=\"prompt mono\">" +
        esc(run.prompt_template) + "</pre></details>";
    }
    var s = run.steps.filter(function (x) { return x.cell; })[k - 1];
    var probs = s.probabilities || {};
    var top = Object.keys(probs).sort(function (a, b) { return probs[b] - probs[a]; }).slice(0, 3);
    var rows = s.top ? s.top.slice(0, 3).map(function (t) {
      return "<tr" + (t.id === s.choice ? ' class="pick"' : "") + "><td class=\"" + (t.on ? "on-t" : "off-t") + "\">" +
        (t.on ? "on" : "off") + "</td><td>" + esc(t.text) + "</td><td class=\"n\">" + pct(t.p) + "</td></tr>";
    }).join("") : top.map(function (id) {
      return "<tr" + (id === s.choice ? ' class="pick"' : "") + "><td class=\"mono\">" + esc(id) + "</td><td>" +
        esc(cellOf(id)) + "</td><td class=\"n\">" + pct(probs[id]) + "</td></tr>";
    }).join("");
    return "<h3>Question " + s.n + " of " + run.target.length + "</h3>" +
      '<div class="kv2">' +
      "<span>options</span><span>" + s.options.length +
        (s.n_on != null ? " (" + s.n_on + " on target, " + s.n_off + " off)" : "") + "</span>" +
      (s.p_on != null ? "<span>P(on target)</span><span>" + pct(s.p_on) + "</span>" : "") +
      "<span>Jev's choice</span><span><b class=\"mono\">" + esc(s.choice) + "</b> " + esc(cellOf(s.choice)) +
      " · p " + pct(s.p) + "</span>" +
      "<span>result</span><span class=\"" + (s.on_target ? "on-t\">on target" : "off-t\">off target") + "</span>" +
      "<span>time</span><span>" + (s.ms != null ? s.ms + " ms" : "–") + "</span>" +
      "</div>" +
      "<div class=\"small muted\">Top 3 options</div><table class=\"top3\">" + rows + "</table>" +
      "<details style=\"margin-top:10px\"><summary class=\"small\">Prompt sent</summary><pre class=\"prompt mono\">" +
      esc(s.prompt) + "</pre></details>";
  }

  runSel.addEventListener("change", function () { loadRun(runSel.value); });
  slider.addEventListener("input", render);
  loadIndex();
})();
</script>
</body>
</html>
